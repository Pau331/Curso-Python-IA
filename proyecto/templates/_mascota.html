{# La mascota dibujada en SVG. "animo" cambia su cara: feliz, normal, triste o sucio.
   Con gafas=True lleva puestas las gafas de pro. #}
{% macro mascota(animo="feliz", clase="", gafas=False) -%}
<svg class="mascota {{ clase }} animo-{{ animo }}" viewBox="0 0 200 200" role="img" aria-label="Tu mascota ({{ animo }})">
  <!-- brote de hojas -->
  <path d="M100 62 Q98 44 100 30" stroke="#3f8a4f" stroke-width="5" fill="none" stroke-linecap="round"/>
  <ellipse cx="84" cy="30" rx="16" ry="8" fill="#5cb85c" transform="rotate(-25 84 30)"/>
  <ellipse cx="116" cy="26" rx="16" ry="8" fill="#6fcf6f" transform="rotate(25 116 26)"/>
  <!-- sombra en el suelo -->
  <ellipse class="sombra" cx="100" cy="188" rx="58" ry="8" fill="rgba(59,53,80,0.15)"/>
  <!-- cuerpo -->
  <ellipse cx="100" cy="122" rx="72" ry="64" fill="#ffb3a7"/>
  <ellipse cx="78" cy="96" rx="22" ry="14" fill="#ffd3cb" transform="rotate(-20 78 96)"/>
  {% if animo == "sucio" %}
    <circle cx="58" cy="140" r="9" fill="#a07a5a" opacity="0.55"/>
    <circle cx="138" cy="150" r="7" fill="#a07a5a" opacity="0.55"/>
    <circle cx="128" cy="98" r="5" fill="#a07a5a" opacity="0.55"/>
  {% endif %}
  <!-- ojos -->
  {% if animo == "feliz" %}
    <path d="M70 118 Q79 106 88 118" stroke="#2b2233" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M112 118 Q121 106 130 118" stroke="#2b2233" stroke-width="6" fill="none" stroke-linecap="round"/>
  {% elif animo == "dormido" %}
    <path d="M70 116 Q79 124 88 116" stroke="#2b2233" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M112 116 Q121 124 130 116" stroke="#2b2233" stroke-width="5" fill="none" stroke-linecap="round"/>
  {% else %}
    <circle cx="79" cy="116" r="9" fill="#2b2233"/><circle cx="82" cy="112" r="3" fill="#fff"/>
    <circle cx="121" cy="116" r="9" fill="#2b2233"/><circle cx="124" cy="112" r="3" fill="#fff"/>
  {% endif %}
  {% if animo == "triste" %}
    <path d="M66 108 L88 100 M134 108 L112 100" stroke="#2b2233" stroke-width="4" stroke-linecap="round"/>
    <path d="M70 128 Q66 140 70 146 Q76 140 70 128" fill="#7cc4f2"/>
  {% endif %}
  {% if gafas %}
    <!-- gafas de pro -->
    <g class="gafas-pro">
      <path d="M44 110 L60 108 M156 110 L140 108" stroke="#2b2233" stroke-width="4" stroke-linecap="round"/>
      <path d="M96 112 Q100 106 104 112" stroke="#2b2233" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="58" y="102" width="40" height="28" rx="10" fill="#2b2233"/>
      <rect x="102" y="102" width="40" height="28" rx="10" fill="#2b2233"/>
      <path d="M64 110 L76 108 M108 110 L120 108" stroke="#8fd3ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <path d="M66 118 L72 117 M110 118 L116 117" stroke="#8fd3ff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    </g>
  {% endif %}
  <!-- mofletes -->
  <ellipse cx="60" cy="136" rx="12" ry="7" fill="#ff7f8c" opacity="0.55"/>
  <ellipse cx="140" cy="136" rx="12" ry="7" fill="#ff7f8c" opacity="0.55"/>
  <!-- boca -->
  {% if animo == "feliz" %}
    <path d="M86 136 Q100 154 114 136 Z" fill="#8c2f3f"/>
  {% elif animo == "dormido" %}
    <ellipse cx="100" cy="142" rx="6" ry="4" fill="#8c2f3f"/>
  {% elif animo == "triste" %}
    <path d="M88 146 Q100 136 112 146" stroke="#2b2233" stroke-width="5" fill="none" stroke-linecap="round"/>
  {% else %}
    <path d="M90 138 Q100 146 110 138" stroke="#2b2233" stroke-width="5" fill="none" stroke-linecap="round"/>
  {% endif %}
</svg>
{%- endmacro %}
